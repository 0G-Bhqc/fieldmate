name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest + ruff（${{ matrix.os }} / py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安装（editable + pdf 后端）
        run: pip install -e ".[dev,pdf]"
      - name: ruff
        run: ruff check .
      - name: pytest
        run: pytest -q

  wheel-smoke:
    name: wheel 冒烟（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 构建 wheel → 干净 venv 安装 → 无关 cwd 跑核心子命令
        run: python scripts/wheel_smoke_test.py
