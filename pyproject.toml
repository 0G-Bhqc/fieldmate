[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldmate"
version = "0.3.0"
description = "Cross-paper comparison and defect-library matching for computational-science research. Harness-agnostic: pure stdlib, no LLM required."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "research", "literature-mining", "defect-library", "reproducibility",
    "benchmark", "evaluation-protocol", "agent-harness", "arxiv",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
# 硬约束：核心零依赖。任何 LLM SDK 都是可选的外部依赖，不是前置条件。
dependencies = []

[project.optional-dependencies]
# pdf extra = 「要解析 PDF 就装这个」。真实测试（2026-10-02）发现只带 pypdf 时，
# corpus_bulk 的 248 篇里 179 篇不可解析 —— pypdf 对科研类 PDF 太脆。
# 抽取器顺序本来就是 fitz 优先（见 _register_extractors 的 docstring），extra 必须与之匹配：
# pymupdf 做主力，pypdf 兜底（两者互补）。
pdf = ["pymupdf>=1.24", "pypdf>=4"]
pdfminer = ["pdfminer.six>=20231228"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
fieldmate = "fieldmate.cli:main"

[tool.setuptools]
# 必须**逐个列出**每个子包。漏一个的后果很隐蔽：源码树里 import 正常
# （直接在仓库里跑），`pip install .` 之后才炸 —— 而 README 承诺的正是
# 「挂到任意 harness 都能用」，那基本就是 pip 安装的用法。
# `audit` 曾漏在这里：源码里一切正常，打包后 `import fieldmate.audit` ModuleNotFoundError。
packages = ["fieldmate", "fieldmate.sources", "fieldmate.match", "fieldmate.compare",
            "fieldmate.gaps", "fieldmate.eval", "fieldmate.exp", "fieldmate.extract",
            "fieldmate.llm", "fieldmate.audit"]
include-package-data = true

[tool.setuptools.package-data]
fieldmate = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]